name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 testet gegen die älteste unterstützte HA-Version (2026.2),
        # 3.14 gegen die aktuelle.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests
      - run: pytest -q
